<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#18261D"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Plan del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EB; --surface:#FFFFFF; --surface-2:#F5F8F3; --ink:#13241A; --muted:#5A6A5F; --line:#D3DCD1;
  --leaf:#1D6A42; --leaf-ink:#FFFFFF; --tag:#F2C230; --tag-ink:#3A2C00; --frame:#18261D;
  --of:#2B6C99; --of-bg:#E1EDF6; --rec:#3B8737; --rec-bg:#E2F1DF; --qc:#8657B3; --qc-bg:#EFE6F7;
  --water:#1D8686; --water-bg:#DBF1F0; --gen:#986A2D; --gen-bg:#F4E9D9; --count:#B44D86; --count-bg:#F7E2EE;
  --rest:#727C76; --rest-bg:#E9ECE9; --vac:#626884; --vac-bg:#E4E6EF;
  --warn:#A86A10; --warn-bg:#FCEFD3; --bad:#B42318; --bad-bg:#FDE5E2; --good:#1C7442; --good-bg:#DDF2E4;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --surface-2:#1B2820; --ink:#E5EEE7; --muted:#9BAAA0; --line:#2B3A30;
  --leaf:#52B47F; --leaf-ink:#06130B; --tag:#E8BB37; --tag-ink:#2A1F00; --frame:#040806;
  --of:#7EB6DE; --of-bg:#182B39; --rec:#84C880; --rec-bg:#1A2F1E; --qc:#C4A2E7; --qc-bg:#2A2138;
  --water:#6DCFCF; --water-bg:#122F30; --gen:#DAA967; --gen-bg:#32281A; --count:#E89BC7; --count-bg:#391E2E;
  --rest:#9AA39D; --rest-bg:#222925; --vac:#A9AECB; --vac-bg:#242637;
  --warn:#E9B14C; --warn-bg:#382C12; --bad:#F27D71; --bad-bg:#3B1A17; --good:#6FD39A; --good-bg:#153121; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --surface-2:#1B2820; --ink:#E5EEE7; --muted:#9BAAA0; --line:#2B3A30;
  --leaf:#52B47F; --leaf-ink:#06130B; --tag:#E8BB37; --tag-ink:#2A1F00; --frame:#040806;
  --of:#7EB6DE; --of-bg:#182B39; --rec:#84C880; --rec-bg:#1A2F1E; --qc:#C4A2E7; --qc-bg:#2A2138;
  --water:#6DCFCF; --water-bg:#122F30; --gen:#DAA967; --gen-bg:#32281A; --count:#E89BC7; --count-bg:#391E2E;
  --rest:#9AA39D; --rest-bg:#222925; --vac:#A9AECB; --vac-bg:#242637;
  --warn:#E9B14C; --warn-bg:#382C12; --bad:#F27D71; --bad-bg:#3B1A17; --good:#6FD39A; --good-bg:#153121; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num,td,.big,.kv b{font-variant-numeric:tabular-nums}

/* page header */
.top{padding-block:28px 8px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--leaf);font-weight:700}
.top h1{font-size:clamp(40px,7vw,68px);line-height:.95;font-weight:700;margin-top:6px}
.top h1 span{background:var(--tag);color:var(--tag-ink);padding:0 .18em;border-radius:4px}
.lede{max-width:70ch;color:var(--muted);font-size:16px;margin:12px 0 0}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.jump a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.jump a:hover{border-color:var(--leaf)}
section.block{padding-block:28px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:34px;font-weight:700}
.sec-h p{margin:0;color:var(--muted)}

/* control bar */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.controls .lab{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted);font-weight:700}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.roles button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.roles button small{font-weight:500;color:var(--muted);font-size:12px}
.roles button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.roles button.on small{color:var(--bg);opacity:.75}
.ctl-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:14px}
.seg button small{font-weight:500;color:var(--muted);margin-left:4px}
.seg button.on{background:var(--leaf);color:var(--leaf-ink)}
.seg button.on small{color:var(--leaf-ink);opacity:.8}
.seg button:disabled{opacity:.45;cursor:not-allowed}
select.sel{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* app grid */
#appgrid{display:grid;gap:20px;align-items:start}
#appgrid.phone-mode{grid-template-columns:minmax(0,420px) minmax(0,1fr)}
@media (max-width:860px){#appgrid.phone-mode{grid-template-columns:minmax(0,1fr)}}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.notes h3{font-size:22px;margin-bottom:8px}
.notes ol{margin:0;padding-left:20px;display:grid;gap:10px}
.notes li b{display:block}
.notes li span{color:var(--muted)}

/* frames */
.win{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.win-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.win-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.win-bar b{margin-left:8px;font-weight:600;color:var(--muted)}
.phone{width:100%;max-width:400px;height:780px;border:10px solid var(--frame);border-radius:38px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;margin:0 auto;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
@media (max-width:460px){.phone{border-width:6px;border-radius:26px;height:720px}}
.phone .appbar{padding:14px 16px 10px;background:var(--leaf);color:var(--leaf-ink)}
.phone .appbar small{opacity:.85;display:block;font-size:13px}
.phone .appbar h3{font-size:24px;font-weight:700}
.phone .scr{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.phone .scr > *{flex-shrink:0}
.koverlay > *{flex-shrink:0}
.tabbar{display:grid;border-top:1px solid var(--line);background:var(--surface)}
.tabbar button{border:0;background:none;padding:9px 2px 11px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--leaf)}

/* manager */
.mgr{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:640px}
.side{border-right:1px solid var(--line);background:var(--surface-2);padding:10px;display:flex;flex-direction:column;gap:4px}
.side-btn{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-btn:hover{background:var(--surface)}
.side-btn.on{background:var(--ink);color:var(--bg)}
.badge{background:var(--tag);color:var(--tag-ink);border-radius:999px;font-size:12px;padding:0 7px;font-weight:700}
.mbody{padding:16px;min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.mgr{grid-template-columns:minmax(0,1fr)}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.side-btn{white-space:nowrap}}
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;padding:10px 14px}
.callout div{display:flex;flex-direction:column}
.callout span{color:var(--muted);font-size:14px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}

.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
.a-OF{background:var(--of-bg);color:var(--of)} .a-REC{background:var(--rec-bg);color:var(--rec)} .a-QC{background:var(--qc-bg);color:var(--qc)}
.a-WATER{background:var(--water-bg);color:var(--water)} .a-GEN{background:var(--gen-bg);color:var(--gen)} .a-COUNT{background:var(--count-bg);color:var(--count)}
.a-REST{background:var(--rest-bg);color:var(--rest)} .a-VAC{background:repeating-linear-gradient(135deg,var(--vac-bg) 0 6px,var(--surface) 6px 10px);color:var(--vac)}

.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
.board{min-width:860px}
.board th,.board td{border-bottom:1px solid var(--line);padding:4px;vertical-align:middle}
.board thead th{background:var(--surface-2);position:sticky;top:0}
.pcol{text-align:left;min-width:120px;padding-left:10px!important}
.pname{display:block;font-weight:700}
.prole{display:block;font-size:12px;color:var(--muted);font-weight:500}
.dayhead{width:100%;border:0;background:none;padding:4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dayhead:hover{background:var(--surface)}
.dayhead.today .dname{background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:0 6px}
.dname{font-weight:700;text-transform:capitalize}
.pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.st-done{background:var(--rest-bg);color:var(--rest)} .st-published{background:var(--good-bg);color:var(--good)} .st-ready{background:var(--warn-bg);color:var(--warn)} .st-draft{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.cell{width:100%;min-height:46px;border:1px solid transparent;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.cell b{font-size:13px}
.cell small{font-size:11px;font-weight:600;opacity:.85}
.cell:hover:not(:disabled){border-color:currentColor}
.cell.past{opacity:.55;cursor:default}
.cell.pend{outline:2px dashed var(--warn);outline-offset:-2px}
.pendtag{color:var(--warn)}
.capcell{font-size:12px;font-weight:600;text-align:center;border-radius:6px;padding:4px}
.lv-good{color:var(--good)} .lv-warn{color:var(--warn)} .lv-bad{color:var(--bad)} .lv-na{color:var(--muted)}
.bg-good{background:var(--good-bg)} .bg-warn{background:var(--warn-bg)} .bg-bad{background:var(--bad-bg)} .bg-na{background:transparent}
tfoot th{font-size:12px;text-align:left;padding-left:10px}

.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);padding:6px;width:210px;display:flex;flex-direction:column;gap:3px}
.menu .mh{font-size:12px;color:var(--muted);padding:4px 6px;font-weight:600}
.menu button.chip{justify-content:flex-start;border:0;padding:7px 10px;font-size:13px}

.dayhdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dayhdr h3{font-size:30px;text-transform:capitalize}
.dayhdr .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.acard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--line)}
.b-OF{border-top-color:var(--of)} .b-REC{border-top-color:var(--rec)} .b-QC{border-top-color:var(--qc)} .b-WATER{border-top-color:var(--water)} .b-GEN{border-top-color:var(--gen)} .b-COUNT{border-top-color:var(--count)} .b-OFF{border-top-color:var(--rest)}
.acard-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.big{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.big small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.kv{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px dotted var(--line);padding-bottom:2px}
.kv span{color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:4px}
.nm{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:13px;font-weight:600}
.muted{color:var(--muted);font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.tk{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;margin:2px 4px 2px 0;font-size:13px}
.tk .x{border:0;background:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.tk.req{border-color:var(--tag)}
.load{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:80px}
.load i{display:block;height:100%;background:var(--leaf)}
.load i.over{background:var(--bad)}
details.msgs{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
details.msgs summary{font-weight:700;cursor:pointer}
.msglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.bubble{background:var(--good-bg);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:13px;white-space:pre-line}
.bubble b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}

.reqs{display:flex;flex-direction:column;gap:8px}
.req{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.req h4{font-family:var(--body);font-size:15px;font-weight:700}
.req .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:3px}
.pri{font-family:var(--display);font-weight:700;font-size:18px;width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.pri1{background:var(--bad-bg);color:var(--bad)} .pri2{background:var(--warn-bg);color:var(--warn)} .pri3{background:var(--rest-bg);color:var(--rest)}
.alloc{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:15px;color:var(--ink);min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{grid-column:1/-1;font-size:13px}
.newreq{border:2px solid var(--tag);border-radius:10px;padding:14px;background:var(--surface);display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.newreq .full{grid-column:1/-1}

.warns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.w{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.w.bad{background:var(--bad-bg);color:var(--bad)} .w.warn{background:var(--warn-bg);color:var(--warn)} .w.good{background:var(--good-bg);color:var(--good)}
.cov{display:grid;grid-template-columns:repeat(15,minmax(36px,1fr));gap:4px;align-items:end;min-width:620px;padding:10px}
.cov div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.cov .bar{width:100%;border-radius:4px 4px 0 0;background:var(--rest-bg);display:flex;align-items:flex-end;justify-content:center;font-weight:700;color:var(--ink);font-size:12px}
.cov .bar.hi{background:var(--bad-bg);color:var(--bad)}
.cov .bar.mid{background:var(--warn-bg);color:var(--warn)}
.team-grid{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:14px}
@media (max-width:760px){.team-grid{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:4px}
.plist button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.plist button.on{border-color:var(--leaf);box-shadow:inset 3px 0 0 var(--leaf)}

/* phone plan */
.plan{display:flex;flex-direction:column;gap:10px}
.plan-date{font-family:var(--display);font-size:22px;font-weight:700;text-transform:capitalize}
.arrive{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.arrive span{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.arrive b{font-family:var(--display);font-size:30px;line-height:1}
.arrive small{width:100%;color:var(--warn);font-weight:600}
.band{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.band small{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.band b{font-family:var(--display);font-size:26px;line-height:1.05}
.band span{font-size:14px;font-weight:600;color:var(--ink)}
.goal{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tsec h4{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 6px}
.task{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.task .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center}
.task.done .box{background:var(--leaf);border-color:var(--leaf)}
.task.done .box::after{content:"";width:6px;height:11px;border:solid var(--leaf-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:600}
.task .tt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.task .tm{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.fine{font-size:12px;color:var(--muted);margin:0}
.offcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
.offcard h3{font-size:30px}
.offcard p{margin:6px 0 0}

function areaBlock(d,a,ro,min){

function offWarn(o){

 if(p.role==='lead'){const other=P.find(x=>x.role==='lead'&&x.id!==p.id);if(other&&S.off.some(x=>x.pid===other.id&&x.status==='approved'&&days.some(dd=>covers(x,dd))))w.push(['bad',L(`${other.name} (líder) también está fuera. Los líderes no pueden faltar al mismo tiempo (Playbook).`,`${other.name} (lead) is also out. Leads can't be off at the same time (Playbook).`)])}

 return w;
}

let toastT;
function toast(msg){S.toast=msg;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},2800)}
let kT;
function suggest(d){
 const meta=META[d];if(!meta)return;
 const outH=meta.out?meta.out[1]:0,inH=meta.in?meta.in[1]:0;
 const pool=P.filter(p=>p.role!=='lead'&&['OF','REC'].includes(areaOf(p.id,d)));
 const tot=outH+inH;if(!tot||!pool.length)return;
 const recLead=P.filter(p=>p.role==='lead'&&p.dept==='REC'&&areaOf(p.id,d)==='REC').length;
 let nRec=Math.round((pool.length+recLead)*inH/tot)-recLead;nRec=Math.max(inH>0?1:0,Math.min(pool.length-(outH>0?1:0),nRec));
 const sorted=[...pool].sort((a,b)=>(a.home==='REC'?0:1)-(b.home==='REC'?0:1));
 sorted.forEach((p,i)=>setArea(d,p.id,i<nRec?'REC':'OF'));
 toast(L(`Equipos sugeridos: Recibo ${nRec+recLead} · OF ${pool.length-nRec}`,`Suggested crews: Receiving ${nRec+recLead} · OF ${pool.length-nRec}`));
}

 S.assign={};for(const d in st.schedule)S.assign[d]=Object.assign({},st.schedule[d]);
 S.tasks=st.tasks;S.off=st.off;S.reqs=st.reqs;S.recurring=st.recurring;
 S.published={};S.start={};for(const d in st.plan){S.published[d]=st.plan[d].published;S.start[d]=st.plan[d].start}
 S.me=st.me;S.role=st.me.role;S.pid=st.me.id;S.version=st.version;
 if(!S.dayDate||!ALLDAYS.includes(S.dayDate))S.dayDate=ALLDAYS.includes(NEXT)?NEXT:ALLDAYS[0];
 if(!S.calMonth)S.calMonth=TODAY.slice(0,7);
 if(!S.teamSel||!base[S.teamSel])S.teamSel=P[0]&&P[0].id;
 if(S.week>=WEEKS.length)S.week=0;
}
const run=(fn,args)=>new Promise((ok,bad)=>{
 if(window.google&&google.script&&google.script.run)return google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](...args);
 if(!/^https:\/\//.test(APP_URL)&&APP_URL.charAt(0)!=='/')return bad(new Error('APP_URL not set'));
 fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})
  .then(r=>r.json()).then(j=>j.err?bad(new Error(j.err)):ok(j.r)).catch(bad)});
const verN=v=>parseInt(String(v||'0').split('|')[0],10)||0;
const Q=[];let busy=false,retryT=null;
function op(name,args){Q.push({name,args});setSync();pump()}
function setSync(){
 S.sync=Q.length||busy?(retryT?'off':'save'):'ok';
 const el=document.getElementById('sync');if(!el)return;
 el.className='sync '+S.sync;
 el.textContent=S.sync==='ok'?'✓':S.sync==='save'?L('Guardando…','Saving…'):L('Sin conexión, reintentando…','Offline, retrying…');
}
function pump(){
 if(busy||!Q.length||!CRED)return;busy=true;const j=Q[0];
 run('pddApi',[CRED.pid,CRED.pin,j.name,JSON.stringify(j.args)]).then(r=>{
  retryT=null;busy=false;
  if(r&&r.ok){Q.shift();
   if(r.state){applyState(r.state);render()}
   else if(r.version&&verN(r.version)===verN(S.version)+1)S.version=r.version;
   setSync();pump();
  }else{
   Q.length=0;setSync();
   if(r&&(r.error==='bad_pin'||r.error==='locked'))return logout();
   toast(L('No se pudo guardar. Se recargó la información.','Could not save. Data was reloaded.'));refresh(true);
  }
 }).catch(()=>{busy=false;retryT=setTimeout(()=>{retryT=null;pump()},4000);setSync()});
}
function refresh(force){
 if(!CRED||(!force&&(busy||Q.length)))return;
 const ae=document.activeElement;
 if(!force&&ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&document.getElementById('stage').contains(ae))return;
 run('pddState',[CRED.pid,CRED.pin]).then(st=>{
  if(st&&st.ok){applyState(st);render()}
  else if(st&&(st.error==='bad_pin'||st.error==='locked'))logout();
 }).catch(()=>{});
}
function poll(){
 if(S.screen!=='app'||busy||Q.length||document.hidden)return;
 run('pddVersion',[]).then(v=>{if(v!==S.version)refresh(false)}).catch(()=>{});
}
let pollT=null;
function startPolling(){
 if(pollT)return;pollT=setInterval(poll,45000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
 setInterval(()=>{const c=document.getElementById('clock');if(c&&S.kDay!=='tomorrow')c.textContent=fT(nowMin())},20000);
}
function startApp(st){
 applyState(st);
 try{if(S.role==='kiosk'){const l=localStorage.getItem('pdd_lang');S.lang=(l==='en'||l==='es')?l:st.me.language}else S.lang=st.me.language}catch(e){S.lang=st.me.language}
 S.screen='app';S.mTab='week';S.memTab='today';S.kDay='today';S.kioskPerson=null;
 startPolling();render();
}
function logout(){
 CRED=null;Q.length=0;busy=false;try{localStorage.removeItem('pdd_cred')}catch(e){}
 Object.assign(S,{screen:'login',role:'',me:null,login:{list:null,sel:null,err:''}});render();loadList();
}
function loadList(){
 run('pddLoginList',[]).then(l=>{S.login.list=l||[];render()}).catch(()=>{S.screen='error';S.err='net';render()});
}
function doLogin(pid,pin){
 S.login.err='';S.login.wait=true;render();
 run('pddLogin',[pid,String(pin).trim()]).then(r=>{
  S.login.wait=false;
  if(r&&r.ok){CRED={pid,pin:String(pin).trim()};try{localStorage.setItem('pdd_cred',JSON.stringify(CRED))}catch(e){}startApp(r.state)}
  else{S.login.err=(r&&r.error==='locked')?'locked':'bad';render()}
 }).catch(()=>{S.login.wait=false;S.login.err='net';render()});
}
function boot(){
 let c=null;try{c=JSON.parse(localStorage.getItem('pdd_cred')||'null')}catch(e){}
 if(c&&c.pid&&c.pin){
  run('pddLogin',[c.pid,c.pin]).then(r=>{
   if(r&&r.ok){CRED=c;startApp(r.state)}
   else{try{localStorage.removeItem('pdd_cred')}catch(e){}S.screen='login';render();loadList()}
  }).catch(()=>{S.screen='error';S.err='net';render()});
 }else{S.screen='login';render();loadList()}
}

/* ---------- LOGIN SCREENS ---------- */
function rLogin(){
 const lst=S.login.list;
 let h=`<div class="login"><h1>Plan del <span>Día</span></h1>`;
 if(!lst)return h+`<p class="muted">${L('Cargando…','Loading…')}</p></div>`;
 h+=`<p class="muted">${L('Toca tu nombre para entrar','Tap your name to sign in')}</p>`;
 for(const [role,lab] of [['manager',L('Gerente','Manager')],['lead',L('Líderes','Leads')],['member',L('Equipo','Team')],['kiosk',L('Pantalla del piso','Floor screen')]]){
  const g=lst.filter(x=>x.role===role);if(!g.length)continue;
  h+=`<h4 class="lh2">${lab}</h4><div class="lgrid">${g.map(x=>`<button class="ltile" data-act="pick" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div>`;
 }
 if(!lst.length)h+=`<p class="muted">${L('Aún no hay personas con PIN. Pide a Cesly que las configure.','Nobody has a PIN yet. Ask Cesly to set them up.')}</p>`;
 return h+`<div class="seg" style="margin-top:18px"><button class="${S.lang==='es'?'on':''}" data-act="lang" data-v="es">ES</button><button class="${S.lang==='en'?'on':''}" data-act="lang" data-v="en">EN</button></div></div>`;
}
function rPin(){
 const p=(S.login.list||[]).find(x=>x.id===S.login.sel)||{name:''};
 const msg={bad:L('PIN incorrecto. Intenta de nuevo.','Wrong PIN. Try again.'),locked:L('Demasiados intentos. Espera 15 minutos.','Too many tries. Wait 15 minutes.'),net:L('Sin conexión. Intenta de nuevo.','No connection. Try again.')}[S.login.err]||'';
 return `<form class="login" data-form="pin"><button type="button" class="linkbtn" data-act="back">← ${L('Cambiar persona','Change person')}</button><h1 style="font-size:44px">${esc(p.name)}</h1><label>${L('Tu PIN','Your PIN')}<input id="pinIn" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" required autofocus style="font-size:28px;letter-spacing:.3em;text-align:center"></label>${msg?`<p class="w bad" role="alert">${msg}</p>`:''}<button class="btn primary wide" ${S.login.wait?'disabled':''}>${S.login.wait?L('Entrando…','Signing in…'):L('Entrar','Sign in')}</button></form>`;
}
function rErr(){return `<div class="login"><h1 style="font-size:40px">${L('Sin conexión','No connection')}</h1><p class="muted">${L('No se pudo cargar la app. Revisa el internet e intenta de nuevo.','The app could not load. Check the internet and try again.')}</p><button class="btn primary" data-act="retry">${L('Reintentar','Retry')}</button></div>`}
function roleName(){const m=S.me;if(!m)return'';return {manager:L('Gerente','Manager'),lead:L('Líder','Lead'),member:L('Equipo','Team'),kiosk:L('Pantalla del piso','Floor screen')}[m.role]||''}

/* ---------- RENDER ---------- */
function renderBar(){
 const b=document.getElementById('bar');
 if(S.screen!=='app'){b.innerHTML=`<div class="brand"><b>Plan del Día</b><small>Cascade Tropicals</small></div>`;return}
 b.innerHTML=`<div class="brand"><b>Plan del Día</b><small>${S.role==='kiosk'?roleName():esc(S.me.name)+' · '+roleName()}</small></div><div class="barr"><span id="sync" class="sync ${S.sync}">✓</span><div class="seg"><button class="${S.lang==='es'?'on':''}" data-act="lang" data-v="es">ES</button><button class="${S.lang==='en'?'on':''}" data-act="lang" data-v="en">EN</button></div><button class="linkbtn barlink" data-act="logout">${L('Salir','Sign out')}</button></div>`;
 setSync();
}
function render(){
 const keep={};document.querySelectorAll('[data-keep]').forEach(el=>keep[el.dataset.keep]=[el.scrollLeft,el.scrollTop]);
 renderBar();
 let inner='',mode='';
 if(S.screen==='boot')inner=`<div class="login"><h1>Plan del <span>Día</span></h1><p class="muted">${L('Cargando…','Loading…')}</p></div>`;
 else if(S.screen==='login')inner=S.login.sel?rPin():rLogin();
 else if(S.screen==='error')inner=rErr();
 else if(S.role==='manager'){inner=rManager();mode='mgr'}
 else if(S.role==='kiosk'){inner=rKiosk();mode='kiosk'}
 else{inner=`<div class="phone">${S.role==='member'?rMember(S.pid):rLead(S.pid)}</div>`;mode='phone'}
 const st=document.getElementById('stage');st.className=mode?'is-'+mode:'';st.innerHTML=inner;
 document.querySelectorAll('[data-keep]').forEach(el=>{const k=keep[el.dataset.keep];if(k){el.scrollLeft=k[0];el.scrollTop=k[1]}});
 rMenu();
 document.getElementById('toast').innerHTML=S.toast?`<div class="toast" role="status">${S.toast}</div>`:'';
 const pi=document.getElementById('pinIn');if(pi&&!S.login.wait)pi.focus();
}
function copyText(t){
 if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
 return new Promise((ok,bad)=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')?ok():bad()}catch(e){bad()}a.remove()});
}
const ACT={
 lang:ds=>{S.lang=ds.v;try{localStorage.setItem('pdd_lang',ds.v)}catch(e){}if(S.screen==='app'&&S.role!=='kiosk')op('lang',{lang:ds.v})},
 logout:()=>logout(),
 retry:()=>{S.screen='boot';render();boot()},
 pick:ds=>{S.login.sel=ds.id;S.login.err=''},
 back:()=>{S.login.sel=null;S.login.err=''},
 mtab:ds=>{S.mTab=ds.v;S.menu=null},
 week:ds=>{S.week=+ds.v},
 goDay:ds=>{S.dayDate=ds.d;S.mTab='day';S.menu=null},
 cell:(ds,el)=>{const r=el.getBoundingClientRect();S.menu={p:ds.p,d:ds.d,x:r.left,y:r.bottom+4}},
 setArea:ds=>{const {p,d}=S.menu;setArea(d,p,ds.a);S.menu=null},
 suggest:()=>suggest(S.dayDate),
 publish:()=>{const d=S.dayDate;S.published[d]=true;op('publish',{date:d});toast(L('Publicado · el equipo ya ve su plan en la app','Published · the team can now see their plan in the app'))},
 copyMsg:ds=>{const m=msgFor(PM[ds.p],S.dayDate);if(m)copyText(m).then(()=>{toast(L('Mensaje copiado','Message copied'));render()}).catch(()=>{})},
 rmTask:ds=>{const t=S.tasks.find(x=>x.id===ds.id);if(t&&t.reqId){const r=S.reqs.find(x=>x.id===t.reqId);if(r)r.status='new'}S.tasks=S.tasks.filter(x=>x.id!==ds.id);op('taskRemove',{id:ds.id})},
 tfilter:ds=>{S.taskFilter=ds.v;S.openTask=null},
 openTask:ds=>{S.openTask=S.openTask===ds.id?null:ds.id},
 unassign:ds=>{const r=S.reqs.find(x=>x.id===ds.id);S.tasks=S.tasks.filter(t=>!(t.reqId===r.id||(t.src==='req'&&t.es===r.es)));r.status='new';S.taskFilter='new';S.openTask=r.id;op('reqUnassign',{id:r.id})},
 newReq:()=>{S.newReq=!S.newReq},
 offOk:ds=>{const o=S.off.find(x=>x.id===ds.id);o.status='approved';op('offDecide',{id:o.id,status:'approved'});toast(L(`Aprobado · ${PM[o.pid].name} ya aparece fuera en la semana`,`Approved · ${PM[o.pid].name} now shows as out on the board`))},
 offNo:ds=>{const o=S.off.find(x=>x.id===ds.id);o.status='denied';op('offDecide',{id:o.id,status:'denied'});toast(L('No aprobado','Denied'))},
 teamSel:ds=>{S.teamSel=ds.p},
 toast:ds=>toast(ds.msg),
 toggleTask:ds=>{const t=S.tasks.find(x=>x.id===ds.id);if(t){t.done=!t.done;op('taskToggle',{id:t.id,done:t.done})}},
 memTab:ds=>{S.memTab=ds.v},
 leadTab:ds=>{S.leadTab[S.pid]=ds.v},
 leadDay:ds=>{S.leadDay=ds.v},
 kDay:ds=>{S.kDay=ds.v},
 kp:ds=>{S.kioskPerson=ds.p;clearTimeout(kT);kT=setTimeout(()=>{S.kioskPerson=null;render()},30000)},
 kclose:()=>{S.kioskPerson=null;clearTimeout(kT)},
 calNav:ds=>{let [y,m]=S.calMonth.split('-').map(Number);m+=+ds.v;if(m<1){m=12;y--}if(m>12){m=1;y++}S.calMonth=`${y}-${pad(m)}`},
 calToday:()=>{S.calMonth=TODAY.slice(0,7)},
 wview:ds=>{S.weekView=ds.v},
 wkTasks:()=>{S.wkTasksOpen=!S.wkTasksOpen},
 teamTab:ds=>{S.teamTab=ds.v},
 rday:ds=>{const r=S.recurring.find(x=>x.id===ds.id),w=+ds.w;r.days=r.days.includes(w)?r.days.filter(x=>x!==w):[...r.days,w].sort();regen(r);op('recUpdate',{id:r.id,days:r.days})},
 rdel:ds=>{S.recurring=S.recurring.filter(x=>x.id!==ds.id);S.tasks=S.tasks.filter(t=>!(t.recId===ds.id&&t.date>TODAY));op('recDelete',{id:ds.id});toast(L('Tarea recurrente eliminada desde mañana','Recurring task removed from tomorrow on'))},
 unrest:ds=>{const p=PM[ds.p];setArea(S.dayDate,p.id,dow(S.dayDate)===6?'NONE':p.home)}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el){if(S.menu&&!e.target.closest('.menu')){S.menu=null;render()}return}
 if(el.tagName==='A')return;
 const a=el.dataset.act;if(!ACT[a])return;
 if(a!=='cell'&&a!=='setArea'&&S.menu&&!el.closest('.menu'))S.menu=null;
 ACT[a](el.dataset,el,e);render();
});
document.addEventListener('change',e=>{
 const id=e.target.id,cl=e.target.classList;
 if(id==='startSel'){S.start[S.dayDate]=+e.target.value;op('setStart',{date:S.dayDate,min:+e.target.value});render()}
 else if(id==='addRest'){if(e.target.value){setArea(S.dayDate,e.target.value,'REST');render()}}
 else if(id==='pullReq'){if(e.target.value){const r=S.reqs.find(x=>x.id===e.target.value);const t=addTask('',S.dayDate,r.est,'during',r.es,r.en,'req','',r.from);t.reqId=r.id;Object.assign(r,{status:'assigned',pid:'',date:S.dayDate});op('reqAssign',{id:r.id,pid:'',date:S.dayDate,min:r.est,when:'during',taskId:t.id});toast(L('Solicitud agregada · elige la persona','Request added · pick a person'));render()}}
 else if(cl.contains('slot')){const d=e.target.dataset.d||S.dayDate,a=e.target.dataset.a,cur=e.target.dataset.cur,v=e.target.value;if(cur&&cur!==v)setArea(d,cur,'NONE');if(v)setArea(d,v,a);render()}
 else if(cl.contains('tperson')){const t=S.tasks.find(x=>x.id===e.target.dataset.id);t.pid=e.target.value;if(t.pid&&dow(t.date)===6&&['REST','NONE'].includes(areaOf(t.pid,t.date))){(S.assign[t.date]=S.assign[t.date]||{})[t.pid]='TASKS'}if(t.reqId){const r=S.reqs.find(x=>x.id===t.reqId);if(r)r.pid=t.pid}op('taskUpdate',{id:t.id,pid:t.pid});render()}
 else if(cl.contains('tw')){const t=S.tasks.find(x=>x.id===e.target.dataset.id);t.when=e.target.value;op('taskUpdate',{id:t.id,when:t.when});render()}
 else if(cl.contains('tmin')){const t=S.tasks.find(x=>x.id===e.target.dataset.id);t.min=+e.target.value||t.min;op('taskUpdate',{id:t.id,min:t.min});render()}
 else if(['rtitle','rperson','rmin','rwhen'].some(c=>cl.contains(c))){const r=S.recurring.find(x=>x.id===e.target.dataset.id),v=e.target.value;let a={id:r.id};
  if(cl.contains('rtitle')){if(!v.trim())return;r.es=r.en=v.trim();a.es=r.es;a.en=r.en}
  else if(cl.contains('rperson')){r.pid=v;a.pid=v}
  else if(cl.contains('rmin')){r.min=+v||r.min;a.min=r.min}
  else{r.when=v;a.when=v}
  regen(r);op('recUpdate',a);toast(L('Actualizado desde mañana','Updated from tomorrow on'));render()}
 else if(id==='al-p'||id==='al-d'){const f=e.target.form,r=S.reqs.find(x=>x.id===f.dataset.id);document.getElementById('al-help').innerHTML=allocHelp(f.p.value,f.d.value,r)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form;
 if(k==='pin'){doLogin(S.login.sel,f.pin.value);return}
 if(k==='alloc'){const r=S.reqs.find(x=>x.id===f.dataset.id);const pid=f.p.value,d=f.d.value,m=+f.m.value||r.est,note=f.n.value.trim();const t=addTask(pid,d,m,f.w.value,r.es,r.en,'req',note,r.from);t.reqId=r.id;Object.assign(r,{status:'assigned',pid,date:d});S.openTask=null;op('reqAssign',{id:r.id,pid,date:d,min:m,when:f.w.value,note,taskId:t.id});toast(L(`Asignada a ${PM[pid].name} · ${dShort(d)} · ${m} min`,`Assigned to ${PM[pid].name} · ${dShort(d)} · ${m} min`))}
 else if(k==='newreq'){const desc=f.desc.value.trim();if(!desc)return;const q={id:rid('r'),from:f.from.value.trim()||'—',team:f.team.value,pri:+f.pri.value,due:f.due.value||addDays(TODAY,3),est:+f.est.value||30,loc:f.loc.value.trim(),es:desc,en:desc,status:'new'};S.reqs.push(q);op('reqAdd',q);S.newReq=false;S.taskFilter='new';toast(L('Solicitud recibida · está en Nuevas','Request received · it\'s under New'))}
 else if(k==='addtask'){const t=f.t.value.trim();if(!t)return;const x=addTask(f.p.value,S.dayDate,+f.m.value||30,f.w.value,t,t,'rutina');op('taskAdd',{id:x.id,date:x.date,pid:x.pid,min:x.min,when:x.when,es:t,en:t,src:'rutina'});toast(L('Tarea agregada','Task added'))}
 else if(k==='newrec'){const t=f.t.value.trim();if(!t)return;const days=[1,2,3,4,5,6].filter(w=>f['d'+w].checked);if(!days.length)return;const r={id:rid('rr'),es:t,en:t,days,pid:f.p.value,min:+f.m.value||30,when:f.w.value};S.recurring.push(r);genRule(r,addDays(TODAY,1));op('recAdd',r);toast(L('Tarea recurrente agregada','Recurring task added'))}
 else if(k==='off'){const s=f.s.value;if(!s)return;let en=f.e.value||s;if(en<s)en=s;const o={id:rid('o'),pid:f.dataset.p,type:f.type.value,start:s,end:en,note:f.note.value.trim(),status:'pending'};S.off.push(o);op('offAdd',{id:o.id,pid:o.pid,type:o.type,start:s,end:en,note:o.note});toast(L('Enviado a Cesly · te avisamos cuando lo revise','Sent to Cesly · you\'ll hear back once it\'s reviewed'))}
 render();
});
window.addEventListener('scroll',()=>{if(S.menu&&Math.abs(scrollY-(S.menu.sy??scrollY))>60){S.menu=null;rMenu()}},{passive:true});
window.addEventListener('resize',()=>{if(S.menu){S.menu=null;rMenu()}});
window.addEventListener('beforeunload',e=>{if(Q.length){e.preventDefault();e.returnValue=''}});
boot();
})();

</script></body></html>
